<h2>
旅行者
</h2>


<p>

无名村的村间小路雨泥淤积，坑坑洼洼。

一个高大的男子伫立在这死寂的夜晚。

雨水掠过他的帽檐，瀑布般滑落。

惨白的月光映照着他的身影，在泥泞的道路上留下孤独的痕迹。

镇民们暗暗掀起窗帘观察着他。

他们知道，这个人一定带着某种目的而来。

可真正令人恐惧的，并不是陌生人的出现。

而是没人知道，他究竟带来了什么。

当旅途开始，当秘密逐渐展开……

你是否准备好面对前方未知的道路？


欢迎来到《旅行者》。

</p>
