<h1>
暗流涌动
</h1>


<div class="author">
作者：官方
</div>


</header>



<section class="intro">

<button id="musicToggle" class="music-toggle">
    🎵 音乐：开
</button>



<p>
乌云在鸦木布拉夫的天空中翻滚着，让这个沉睡中的小镇和迷信的居民们笼罩在不祥的阴影之中。

刚洗过的衣物在屋舍间的细绳上诡异地起舞。

烟囱向外吐出滚滚的浓烟。

当远处的地平线上雷声响起时，焦虑的母亲们把玩耍中的孩子唤回家中。

然而，如果你再仔细聆听，仍然可以听见近处森林里的诡异回声。

只有那些读懂迹象的人，才能明白，有什么正在……

暗流涌动。
</p>
<audio id="bgMusic" loop preload="metadata">
    <source src="Dead Can Dance - The Host Of Seraphim.mp3" type="audio/mpeg">
</audio>

</section>




<section class="gallery">


<div>

<img src="new-01.webp">

</div>


<div>

<img src="new-02.webp">

</div>


</section>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const lightbox =
        document.getElementById("imageLightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");

    const closeButton =
        document.getElementById("imageLightboxClose");

    const galleryImages =
        document.querySelectorAll(".gallery img");


    // 点击图片
    galleryImages.forEach(function (image) {

        image.addEventListener("click", function (event) {

            event.preventDefault();

            lightboxImage.src =
                image.currentSrc || image.src;

            lightboxImage.alt =
                image.alt || "剧本图片";

            lightbox.classList.add("show");

            // 打开大图后，禁止背景页面滚动
            document.body.style.overflow = "hidden";

        });

    });


    // 关闭图片
    function closeLightbox() {

        lightbox.classList.remove("show");

        // 恢复页面滚动
        document.body.style.overflow = "";

    }


    // 点击右上角 ×
    closeButton.addEventListener("click", function (event) {

        event.preventDefault();
        event.stopPropagation();

        closeLightbox();

    });


    // 点击黑色背景
    lightbox.addEventListener("click", function (event) {

        if (event.target === lightbox) {

            closeLightbox();

        }

    });


    // 电脑按 Esc 关闭
    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            closeLightbox();

        }

    });

});

</script>
</body>

</html>
