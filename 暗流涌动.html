<head>

<title>

</title>


<link rel="stylesheet" href="detail.css">


</head>


<body>


<header class="detail-header">
<a
    href="index.html"
    class="back-home">
    ← 返回剧本查阅
</a>
<h1>
暗流涌动
</h1>


<div class="author">
作者：官方
</div>


</header>



<section class="intro">

<button id="musicToggle" class="music-toggle">
    🎵 音乐：开
</button>



<p>
乌云在鸦木布拉夫的天空中翻滚着，让这个沉睡中的小镇和迷信的居民们笼罩在不祥的阴影之中。

刚洗过的衣物在屋舍间的细绳上诡异地起舞。

烟囱向外吐出滚滚的浓烟。

当远处的地平线上雷声响起时，焦虑的母亲们把玩耍中的孩子唤回家中。

然而，如果你再仔细聆听，仍然可以听见近处森林里的诡异回声。

只有那些读懂迹象的人，才能明白，有什么正在……

暗流涌动。
</p>
<audio id="bgMusic" loop preload="metadata">
    <source src="Dead Can Dance - The Host Of Seraphim.mp3" type="audio/mpeg">
</audio>

</section>




<section class="gallery">


<div>

<img src="new-01.webp">

</div>


<div>

<img src="new-02.webp">

</div>


</section>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const music = document.getElementById("bgMusic");
    const button = document.getElementById("musicToggle");

    // 音量 10%
    music.volume = 0.1;

    // 记住暗流涌动自己的音乐状态
    const savedState = localStorage.getItem("music-anliu");

    if (savedState === "off") {

        music.pause();

        button.textContent = "🎵 音乐：关";

    } else {

        music.play().catch(function () {

            // 浏览器禁止自动播放时，
            // 第一次点击页面后尝试播放
            document.addEventListener(
                "click",
                function startMusic() {

                    music.play().catch(function(){});

                    document.removeEventListener(
                        "click",
                        startMusic
                    );

                },
                { once:true }
            );

        });

    }


    // 点击音乐按钮
    button.addEventListener("click", function (event) {

        event.stopPropagation();

        if (music.paused) {

            music.play().catch(function(){});

            localStorage.setItem(
                "music-anliu",
                "on"
            );

            button.textContent = "🎵 音乐：开";

        } else {

            music.pause();

            localStorage.setItem(
                "music-anliu",
                "off"
            );

            button.textContent = "🎵 音乐：关";

        }

    });

});

</script>
<!-- 图片放大查看 -->

<div id="imageLightbox" class="image-lightbox">

    <button
        id="imageLightboxClose"
        class="image-lightbox-close">
        ×
    </button>

    <img
        id="lightboxImage"
        src=""
        alt="剧本图片">

</div>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const lightbox = document.getElementById("imageLightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const closeButton = document.getElementById("imageLightboxClose");

    const galleryImages = document.querySelectorAll(".gallery img");


    // 点击图片放大
    galleryImages.forEach(function (image) {

        image.addEventListener("click", function () {

            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt || "剧本图片";

            lightbox.classList.add("show");

        });

    });


    // 点击 × 关闭
    closeButton.addEventListener("click", function () {

        lightbox.classList.remove("show");

    });


    // 点击黑色背景关闭
    lightbox.addEventListener("click", function (event) {

        if (event.target === lightbox) {

            lightbox.classList.remove("show");

        }

    });


    // 按 Esc 键关闭
    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            lightbox.classList.remove("show");

        }

    });

});

</script>
</body>

</html>
