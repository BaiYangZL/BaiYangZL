<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>瓦釜雷鸣</title>

<link rel="stylesheet" href="detail.css">

</head>


<body>


<header class="detail-header">

<a
    href="index.html"
    class="back-home">
    ← 返回剧本查阅
</a>

<h1>
瓦釜雷鸣
</h1>

<div class="author">
作者：Emily
</div>

</header>



<section class="intro">

<button id="musicToggle" class="music-toggle">
🎵 音乐：开
</button>


<p>

在古老的瓦釜镇，雷鸣不仅仅是天际的怒吼，更是隐藏于人心深处的震颤与回响。

这是一个被遗忘的角落，一个被历史尘封的秘密之地，而今，一场突如其来的风暴，唤醒了沉睡的谜团，让每一个踏入这片土地的人，都不可避免地卷入了一场关于权力、背叛与救赎的漩涡之中。

</p>

</section>



<section class="gallery">

<div>

<img
    src="19.webp"
    alt="瓦釜雷鸣剧本介绍">

</div>

<div>

<img
    src="20.webp"
    alt="瓦釜雷鸣角色规则">

</div>

</section>



<!-- 背景音乐 -->

<audio
    id="bgMusic"
    src="Carl Orff - O Fortuna.mp3"
    loop
    preload="auto">
</audio>



<!-- 图片放大查看 -->

<div
    id="imageLightbox"
    class="image-lightbox">

<button
    id="lightboxClose"
    class="lightbox-close"
    type="button">
    ×
</button>

<img
    id="lightboxImage"
    src=""
    alt="放大图片">

</div>




<script>

/* =========================
   图片放大 / 缩放 / 拖动
========================= */

const lightbox =
    document.getElementById(
        "imageLightbox"
    );


const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );


const lightboxClose =
    document.getElementById(
        "lightboxClose"
    );


const galleryImages =
    document.querySelectorAll(
        ".gallery img"
    );



/* 缩放 */

let scale = 1;


/* 图片移动 */

let translateX = 0;
let translateY = 0;



/* 鼠标拖动 */

let isDragging = false;

let startX = 0;
let startY = 0;

let startTranslateX = 0;
let startTranslateY = 0;



/* 手机双指缩放 */

let initialPinchDistance = null;

let initialPinchScale = 1;




/* 更新图片变换 */

function updateImageTransform(){

    lightboxImage.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) " +
        "scale(" +
        scale +
        ")";

}



/* 重置图片 */

function resetImage(){

    scale = 1;

    translateX = 0;
    translateY = 0;

    updateImageTransform();

}



/* =========================
   打开图片
========================= */

galleryImages.forEach(
    function(img){

        img.addEventListener(
            "click",
            function(){

                lightboxImage.src =
                    img.src;

                lightboxImage.alt =
                    img.alt ||
                    "放大图片";


                resetImage();


                lightbox.classList.add(
                    "show"
                );


                document.body.style.overflow =
                    "hidden";

            }
        );

    }
);




/* =========================
   关闭图片
========================= */

function closeLightbox(){

    lightbox.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";


    lightboxImage.src = "";

}



lightboxClose.addEventListener(
    "click",
    closeLightbox
);



/* 点击黑色背景关闭 */

lightbox.addEventListener(
    "click",
    function(e){

        if(e.target === lightbox){

            closeLightbox();

        }

    }
);




/* =========================
   Esc 关闭
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeLightbox();

        }

    }
);




/* =========================
   鼠标滚轮缩放
========================= */

lightboxImage.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();


        if(e.deltaY < 0){

            scale += 0.15;

        }else{

            scale -= 0.15;

        }


        scale = Math.max(
            0.05,
            Math.min(5, scale)
        );


        updateImageTransform();

    },
    {
        passive:false
    }
);




/* =========================
   鼠标拖动
========================= */

lightboxImage.addEventListener(
    "mousedown",
    function(e){

        e.preventDefault();


        isDragging = true;


        startX = e.clientX;
        startY = e.clientY;


        startTranslateX =
            translateX;

        startTranslateY =
            translateY;

    }
);



document.addEventListener(
    "mousemove",
    function(e){

        if(!isDragging){

            return;

        }


        translateX =
            startTranslateX +
            (
                e.clientX -
                startX
            );


        translateY =
            startTranslateY +
            (
                e.clientY -
                startY
            );


        updateImageTransform();

    }
);



document.addEventListener(
    "mouseup",
    function(){

        isDragging = false;

    }
);




/* =========================
   手机触摸
========================= */

lightboxImage.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();


        /* 双指 */

        if(e.touches.length === 2){

            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;


            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;


            initialPinchDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            initialPinchScale =
                scale;


            return;

        }



        /* 单指 */

        if(e.touches.length === 1){

            startX =
                e.touches[0].clientX;


            startY =
                e.touches[0].clientY;


            startTranslateX =
                translateX;


            startTranslateY =
                translateY;

        }

    },
    {
        passive:false
    }
);




/* =========================
   手机触摸移动
========================= */

lightboxImage.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();


        /* 双指缩放 */

        if(
            e.touches.length === 2 &&
            initialPinchDistance
        ){

            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;


            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;


            const currentDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            scale =
                initialPinchScale *
                (
                    currentDistance /
                    initialPinchDistance
                );


            scale = Math.max(
                0.05,
                Math.min(5, scale)
            );


            updateImageTransform();

            return;

        }



        /* 单指拖动 */

        if(e.touches.length === 1){

            translateX =
                startTranslateX +
                (
                    e.touches[0].clientX -
                    startX
                );


            translateY =
                startTranslateY +
                (
                    e.touches[0].clientY -
                    startY
                );


            updateImageTransform();

        }

    },
    {
        passive:false
    }
);




/* =========================
   手机触摸结束
========================= */

lightboxImage.addEventListener(
    "touchend",
    function(e){

        if(e.touches.length < 2){

            initialPinchDistance =
                null;

        }

    }
);

</script>
<script src="music.js"></script>

</body>

</html>
