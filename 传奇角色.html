<section class="intro">




<p>

疲倦车夫推开酒馆的大门。

壁炉中的火焰跳动着，温暖驱散了旅途的寒意。

众人围坐在桌旁，等待一个关于远方的故事。

他说自己穿过沙漠，见过星辰，也遇见过无法解释的奇迹。

有人相信他的故事。

有人认为那只是醉后的幻想。

但每一个传奇的开始，都来自一个无人知晓的夜晚。


今晚，让我们围坐在壁炉旁。

听他说说……

那些被时间遗忘的传奇。

</p>
