<h2>
夜半狂欢
</h2>



<p>

在被遗忘的午夜小镇。

一场名为“夜半狂欢”的宴会悄然开启。

古老的钟楼再次响起。

沉睡已久的旋转木马缓缓转动。

受邀而来的宾客踏入这场诡秘的盛宴。

然而没有人知道。

欢笑与音乐背后，

隐藏着一场关于谎言、背叛与死亡的游戏。

当钟声再次响起。

谁是真正的守护者？

谁又是隐藏在人群中的恶魔？

欢迎来到《夜半狂欢》。

</p>
