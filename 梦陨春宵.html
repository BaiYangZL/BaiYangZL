梦陨春宵
</title>

</head>


<body>


<header class="detail-header">

<a
    href="index.html"
    class="back-home">
    ← 返回剧本查阅
</a>

<h1>
梦陨春宵
</h1>

<div class="author">
作者：官方
</div>

</header>


<section class="intro">

<button
    id="musicToggle"
    class="music-toggle">
    🎵 音乐：开
</button>


<p>

生机勃勃的春天已然过去，温暖迷人的夏天悄然来临。

园丁在公园和窗栏上精心培育，让百花齐放，一望无际。

鸟儿在歌唱，艺术家们拿起了画笔，哲学家在酒馆里思索人生的终极奥秘。

城镇周围搭建起老旧的帐篷，预示着马戏团即将开启。

然而，在人们沉湎于纸醉金迷和灯红酒绿时，黑暗势力却悄然崛起。

女巫和异教徒们潜藏在郊区的遗迹之间，在地下洞穴中密谋着渗透城镇。

而那些沉醉于狂欢之中的居民们，却浑然不知危险正在靠近。

良辰已至……

梦陨春宵。

</p>


<audio
    id="bgMusic"
    loop
    preload="metadata">

    <source
        src="Scott Joplin - The Entertainer.mp3"
        type="audio/mpeg">

</audio>

</section>



<section class="gallery">


<div>

<img src="new-05.webp">

</div>


<div>

<img src="new-06.webp">

</div>


</section>



<div
    id="imageLightbox"
    class="image-lightbox">

    <button
        id="imageLightboxClose"
        class="image-lightbox-close">
        ×
    </button>

    <img
        id="lightboxImage"
        src=""
        alt="剧本图片">

</div>



<script>


/* =========================
   背景音乐
========================= */

const music =
    document.getElementById("bgMusic");

const musicToggle =
    document.getElementById("musicToggle");


/*
   梦陨春宵单独保存音乐状态
*/

const savedState =
    localStorage.getItem("music-mengyun");


/*
   音量 10%
*/

music.volume = 0.1;


/*
   默认开启
*/

let musicOn =
    savedState !== "off";


function updateMusicButton(){

    if(musicOn){

        musicToggle.textContent =
            "🎵 音乐：开";

    }else{

        musicToggle.textContent =
            "🔇 音乐：关";

    }

}


/*
   尝试自动播放
*/

function tryPlayMusic(){

    if(!musicOn){
        return;
    }

    music.play().catch(() => {

        /*
           浏览器如果阻止自动播放，
           等用户第一次点击页面后再播放
        */

        const startMusic =
            () => {

                if(musicOn){

                    music.play().catch(() => {});

                }

                document.removeEventListener(
                    "click",
                    startMusic
                );

            };

        document.addEventListener(
            "click",
            startMusic
        );

    });

}


/*
   点击音乐按钮
*/

musicToggle.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        if(musicOn){

            music.pause();

            musicOn = false;

            localStorage.setItem(
                "music-mengyun",
                "off"
            );

        }else{

            musicOn = true;

            music.play().catch(() => {});

            localStorage.setItem(
                "music-mengyun",
                "on"
            );

        }

        updateMusicButton();

    }
);


updateMusicButton();

tryPlayMusic();



/* =========================
   图片放大 / 缩小 / 拖动
========================= */

const lightbox =
    document.getElementById("imageLightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("imageLightboxClose");

const galleryImages =
    document.querySelectorAll(".gallery img");


let scale = 1;

let translateX = 0;

let translateY = 0;


let isDragging = false;

let startX = 0;

let startY = 0;

let lastX = 0;

let lastY = 0;


/*
   更新图片位置
*/

function updateTransform(){

    lightboxImage.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;

}


/*
   重置图片
*/

function resetImage(){

    scale = 1;

    translateX = 0;

    translateY = 0;

    updateTransform();

}


/*
   点击缩略图打开大图
*/

galleryImages.forEach(
    function(img){

        img.addEventListener(
            "click",
            function(){

                lightboxImage.src =
                    img.src;

                resetImage();

                lightbox.classList.add("show");

                document.body.style.overflow =
                    "hidden";

            }
        );

    }
);


/*
   关闭图片
*/

function closeLightbox(){

    lightbox.classList.remove("show");

    document.body.style.overflow =
        "";

}


lightboxClose.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        closeLightbox();

    }
);


/*
   点击黑色背景关闭
*/

lightbox.addEventListener(
    "click",
    function(event){

        if(event.target === lightbox){

            closeLightbox();

        }

    }
);


/*
   ESC 关闭
*/

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeLightbox();

        }

    }
);



/* =========================
   鼠标滚轮缩放
========================= */

lightboxImage.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();

        if(event.deltaY < 0){

            scale += 0.15;

        }else{

            scale -= 0.15;

        }


        /*
           最小 0.05
           最大 5
        */

        if(scale < 0.05){

            scale = 0.05;

        }

        if(scale > 5){

            scale = 5;

        }

        updateTransform();

    },
    { passive:false }
);



/* =========================
   电脑鼠标拖动
========================= */

lightboxImage.addEventListener(
    "mousedown",
    function(event){

        event.preventDefault();

        isDragging = true;

        startX = event.clientX;

        startY = event.clientY;

        lastX = translateX;

        lastY = translateY;

    }
);


document.addEventListener(
    "mousemove",
    function(event){

        if(!isDragging){

            return;

        }

        translateX =
            lastX +
            (event.clientX - startX);

        translateY =
            lastY +
            (event.clientY - startY);

        updateTransform();

    }
);


document.addEventListener(
    "mouseup",
    function(){

        isDragging = false;

    }
);



/* =========================
   手机触摸缩放
========================= */

let initialDistance = 0;

let initialScale = 1;


/*
   计算两指距离
*/

function getTouchDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/*
   双指缩放
*/

lightboxImage.addEventListener(
    "touchstart",
    function(event){

        if(event.touches.length === 2){

            event.preventDefault();

            initialDistance =
                getTouchDistance(
                    event.touches
                );

            initialScale =
                scale;

        }

        else if(event.touches.length === 1){

            startX =
                event.touches[0].clientX;

            startY =
                event.touches[0].clientY;

            lastX =
                translateX;

            lastY =
                translateY;

        }

    },
    { passive:false }
);


lightboxImage.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();


        /*
           双指缩放
        */

        if(event.touches.length === 2){

            const currentDistance =
                getTouchDistance(
                    event.touches
                );


            if(initialDistance > 0){

                scale =
                    initialScale *
                    (
                        currentDistance /
                        initialDistance
                    );


                if(scale < 0.05){

                    scale = 0.05;

                }


                if(scale > 5){

                    scale = 5;

                }

                updateTransform();

            }

        }


        /*
           单指拖动
        */

        else if(event.touches.length === 1){

            translateX =
                lastX +
                (
                    event.touches[0].clientX -
                    startX
                );

            translateY =
                lastY +
                (
                    event.touches[0].clientY -
                    startY
                );

            updateTransform();

        }

    },
    { passive:false }
);


lightboxImage.addEventListener(
    "touchend",
    function(){

        initialDistance = 0;

    }
);


</script>


</body>

</html>
