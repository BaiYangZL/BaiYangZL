<section class="intro">





<p>

无名村的夜晚，总是比别处来得更加寂静。

破旧的木屋隐藏在浓雾之中，潮湿的石路被雨水冲刷得泥泞不堪。

远处的荒林传来断断续续的风声，像有人在黑暗中低声交谈。

村民们早已习惯了这样的夜晚。

他们知道，有些声音不该回应，有些秘密不该追寻。

可最近，那些声音变得越来越清晰。

每当午夜降临，村庄的角落里总会响起若有若无的低语。

是谁，在黑暗中窃窃私语？

又是谁，将成为下一个被秘密吞噬的人？

欢迎来到——

《窃窃私语》。

</p>
