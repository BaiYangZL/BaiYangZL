</title>

</head>


<body>


<header class="detail-header">

<a
    href="index.html"
    class="back-home">

<h1>
窃窃私语
</h1>

<div class="author">
作者：官方
</div>

</header>



<section class="intro">

<button
    id="musicToggle"
    class="music-toggle">
    🎵 音乐：开
</button>


<p>

无名村的夜晚，总是比别处来得更加寂静。

破旧的木屋隐藏在浓雾之中，潮湿的石路被雨水冲刷得泥泞不堪。

远处的荒林传来断断续续的风声，像有人在黑暗中低声交谈。

村民们早已习惯了这样的夜晚。

他们知道，有些声音不该回应，有些秘密不该追寻。

可最近，那些声音变得越来越清晰。

每当午夜降临，村庄的角落里总会响起若有若无的低语。

是谁，在黑暗中窃窃私语？

又是谁，将成为下一个被秘密吞噬的人？

欢迎来到——

《窃窃私语》。

</p>


<audio
    id="bgMusic"
    loop
    preload="metadata">

    <source
        src="牙是野兽 - 虫语.mp3"
        type="audio/mpeg">

</audio>

</section>



<section class="gallery">


<div>

<img src="7.webp">

</div>


<div>

<img src="8.webp">

</div>


</section>



<div
    id="imageLightbox"
    class="image-lightbox">

    <button
        id="imageLightboxClose"
        class="image-lightbox-close">
        ×
    </button>

    <img
        id="lightboxImage"
        src=""
        alt="剧本图片">

</div>



<script>


/* =========================
   背景音乐
========================= */

const music =
    document.getElementById("bgMusic");

const musicToggle =
    document.getElementById("musicToggle");


/*
   窃窃私语单独保存音乐状态
*/

const savedState =
    localStorage.getItem("music-qieqiesiyu");


/*
   音量 10%
*/

music.volume = 0.1;


/*
   默认开启
*/

let musicOn =
    savedState !== "off";


function updateMusicButton(){

    if(musicOn){

        musicToggle.textContent =
            "🎵 音乐：开";

    }else{

        musicToggle.textContent =
            "🔇 音乐：关";

    }

}


/*
   尝试自动播放
*/

function tryPlayMusic(){

    if(!musicOn){

        return;

    }

    music.play().catch(() => {

        /*
           如果浏览器阻止自动播放，
           用户第一次点击页面后再播放
        */

        const startMusic =
            () => {

                if(musicOn){

                    music.play().catch(() => {});

                }

                document.removeEventListener(
                    "click",
                    startMusic
                );

            };

        document.addEventListener(
            "click",
            startMusic
        );

    });

}


/*
   点击音乐按钮
*/

musicToggle.addEventListener(
    "click",
    function(event){

        event.stopPropagation();


        if(musicOn){

            music.pause();

            musicOn = false;

            localStorage.setItem(
                "music-qieqiesiyu",
                "off"
            );

        }else{

            musicOn = true;

            music.play().catch(() => {});

            localStorage.setItem(
                "music-qieqiesiyu",
                "on"
            );

        }


        updateMusicButton();

    }
);


updateMusicButton();

tryPlayMusic();



/* =========================
   图片放大 / 缩小 / 拖动
========================= */

const lightbox =
    document.getElementById("imageLightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("imageLightboxClose");

const galleryImages =
    document.querySelectorAll(".gallery img");


let scale = 1;

let translateX = 0;

let translateY = 0;


let isDragging = false;

let startX = 0;

let startY = 0;

let lastX = 0;

let lastY = 0;


/*
   更新图片位置
*/

function updateTransform(){

    lightboxImage.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;

}


/*
   重置图片
*/

function resetImage(){

    scale = 1;

    translateX = 0;

    translateY = 0;

    updateTransform();

}


/*
   点击图片打开大图
*/

galleryImages.forEach(
    function(img){

        img.addEventListener(
            "click",
            function(){

                lightboxImage.src =
                    img.src;

                resetImage();

                lightbox.classList.add("show");

                document.body.style.overflow =
                    "hidden";

            }
        );

    }
);


/*
   关闭图片
*/

function closeLightbox(){

    lightbox.classList.remove("show");

    document.body.style.overflow =
        "";

}


lightboxClose.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        closeLightbox();

    }
);


/*
   点击黑色背景关闭
*/

lightbox.addEventListener(
    "click",
    function(event){

        if(event.target === lightbox){

            closeLightbox();

        }

    }
);


/*
   ESC 关闭
*/

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeLightbox();

        }

    }
);



/* =========================
   鼠标滚轮缩放
========================= */

lightboxImage.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();


        if(event.deltaY < 0){

            scale += 0.15;

        }else{

            scale -= 0.15;

        }


        /*
           最小 0.05
           最大 5
        */

        if(scale < 0.05){

            scale = 0.05;

        }


        if(scale > 5){

            scale = 5;

        }


        updateTransform();

    },
    { passive:false }
);



/* =========================
   电脑鼠标拖动
========================= */

lightboxImage.addEventListener(
    "mousedown",
    function(event){

        event.preventDefault();

        isDragging = true;

        startX =
            event.clientX;

        startY =
            event.clientY;

        lastX =
            translateX;

        lastY =
            translateY;

    }
);


document.addEventListener(
    "mousemove",
    function(event){

        if(!isDragging){

            return;

        }


        translateX =
            lastX +
            (
                event.clientX -
                startX
            );


        translateY =
            lastY +
            (
                event.clientY -
                startY
            );


        updateTransform();

    }
);


document.addEventListener(
    "mouseup",
    function(){

        isDragging = false;

    }
);



/* =========================
   手机触摸缩放
========================= */

let initialDistance = 0;

let initialScale = 1;


/*
   计算两指距离
*/

function getTouchDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/*
   双指缩放 / 单指拖动开始
*/

lightboxImage.addEventListener(
    "touchstart",
    function(event){

        if(event.touches.length === 2){

            event.preventDefault();

            initialDistance =
                getTouchDistance(
                    event.touches
                );

            initialScale =
                scale;

        }

        else if(event.touches.length === 1){

            startX =
                event.touches[0].clientX;

            startY =
                event.touches[0].clientY;

            lastX =
                translateX;

            lastY =
                translateY;

        }

    },
    { passive:false }
);


/*
   双指缩放 / 单指拖动
*/

lightboxImage.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();


        /*
           双指缩放
        */

        if(event.touches.length === 2){

            const currentDistance =
                getTouchDistance(
                    event.touches
                );


            if(initialDistance > 0){

                scale =
                    initialScale *
                    (
                        currentDistance /
                        initialDistance
                    );


                if(scale < 0.05){

                    scale = 0.05;

                }


                if(scale > 5){

                    scale = 5;

                }


                updateTransform();

            }

        }


        /*
           单指拖动
        */

        else if(event.touches.length === 1){

            translateX =
                lastX +
                (
                    event.touches[0].clientX -
                    startX
                );


            translateY =
                lastY +
                (
                    event.touches[0].clientY -
                    startY
                );


            updateTransform();

        }

    },
    { passive:false }
);


lightboxImage.addEventListener(
    "touchend",
    function(){

        initialDistance = 0;

    }
);


</script>


</body>

</html>
