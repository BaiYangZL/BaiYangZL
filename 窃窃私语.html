<p>

无名村的夜晚，总是比别处来得更加寂静。

破旧的木屋隐藏在浓雾之中，潮湿的石路被雨水冲刷得泥泞不堪。

远处的荒林传来断断续续的风声，像有人在黑暗中低声交谈。

村民们早已习惯了这样的夜晚。

他们知道，有些声音不该回应，有些秘密不该追寻。

可最近，那些声音变得越来越清晰。

每当午夜降临，村庄的角落里总会响起若有若无的低语。

是谁，在黑暗中窃窃私语？

又是谁，将成为下一个被秘密吞噬的人？

欢迎来到——

《窃窃私语》。

</p>

 <!-- 这下面是播放音乐的代码 -->
<audio id="bgMusic" loop preload="metadata">
    <source src="牙是野兽 - 虫语.mp3" type="audio/mpeg">
</audio>

<button id="musicToggle" class="music-toggle">
    🎵 音乐：开
</button>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const music = document.getElementById("bgMusic");
    const button = document.getElementById("musicToggle");

    // 默认音量 10%
    music.volume = 0.1;

    // 记住《窃窃私语》的音乐开关
    const savedState = localStorage.getItem("music-qieqiesiyu");

    if (savedState === "off") {
        music.pause();
        button.textContent = "🎵 音乐：关";
    } else {
        music.play().catch(function () {
            // 如果浏览器阻止自动播放，
            // 用户第一次点击页面时再播放
            document.addEventListener("click", function startMusic() {
                music.play().catch(function(){});
                document.removeEventListener("click", startMusic);
            }, { once: true });
        });
    }

    // 点击按钮开 / 关
    button.addEventListener("click", function (event) {

        event.stopPropagation();

        if (music.paused) {

            music.play().catch(function(){});

            localStorage.setItem("music-qieqiesiyu", "on");

            button.textContent = "🎵 音乐：开";

        } else {

            music.pause();

            localStorage.setItem("music-qieqiesiyu", "off");

            button.textContent = "🎵 音乐：关";
        }

    });

});
</script>
