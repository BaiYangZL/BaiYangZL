<section class="intro">




<p>

恰逢上元佳节。

整座城市张灯结彩，万家灯火映照夜空。

人们欢笑、祈福、庆祝新的开始。

然而繁华背后，古老的封印正在悄然松动。

森林深处传来异样的声音。

白狐的眼中闪烁着诡异的光芒。

活死人的传说再次出现。

当所有人沉浸于节日之中时，

黑暗已经重新苏醒。


欢迎来到《华灯初上》。

</p>
