</title>

</head>


<body>


<header class="detail-header">

<a
    href="index.html"
    class="back-home">
    ← 返回剧本查阅
</a>

<h1>
华灯初上
</h1>

<div class="author">
作者：官方
</div>

</header>



<section class="intro">

<button
    id="musicToggle"
    class="music-toggle">
    🎵 音乐：开
</button>


<p>

恰逢上元佳节。

整座城市张灯结彩，万家灯火映照夜空。

人们欢笑、祈福、庆祝新的开始。

然而繁华背后，古老的封印正在悄然松动。

森林深处传来异样的声音。

白狐的眼中闪烁着诡异的光芒。

活死人的传说再次出现。

当所有人沉浸于节日之中时，

黑暗已经重新苏醒。


欢迎来到《华灯初上》。

</p>


<audio
    id="bgMusic"
    loop
    preload="metadata">

    <source
        src="西山居游戏音乐 - 扬州城内.mp3"
        type="audio/mpeg">

</audio>

</section>



<section class="gallery">


<div>

<img src="15.webp">

</div>


<div>

<img src="16.webp">

</div>


</section>



<div
    id="imageLightbox"
    class="image-lightbox">

    <button
        id="imageLightboxClose"
        class="image-lightbox-close">
        ×
    </button>

    <img
        id="lightboxImage"
        src=""
        alt="剧本图片">

</div>





<script>

/* =========================
   图片放大 / 缩小 / 拖动
========================= */

const lightbox =
    document.getElementById("imageLightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("imageLightboxClose");

const galleryImages =
    document.querySelectorAll(".gallery img");


let scale = 1;

let translateX = 0;

let translateY = 0;


let isDragging = false;

let startX = 0;

let startY = 0;

let lastX = 0;

let lastY = 0;


/*
   更新图片位置
*/

function updateTransform(){

    lightboxImage.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;

}


/*
   重置图片
*/

function resetImage(){

    scale = 1;

    translateX = 0;

    translateY = 0;

    updateTransform();

}


/*
   点击图片打开大图
*/

galleryImages.forEach(
    function(img){

        img.addEventListener(
            "click",
            function(){

                lightboxImage.src =
                    img.src;

                resetImage();

                lightbox.classList.add("show");

                document.body.style.overflow =
                    "hidden";

            }
        );

    }
);


/*
   关闭图片
*/

function closeLightbox(){

    lightbox.classList.remove("show");

    document.body.style.overflow =
        "";

}


lightboxClose.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        closeLightbox();

    }
);


/*
   点击黑色背景关闭
*/

lightbox.addEventListener(
    "click",
    function(event){

        if(event.target === lightbox){

            closeLightbox();

        }

    }
);


/*
   ESC 关闭
*/

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeLightbox();

        }

    }
);



/* =========================
   鼠标滚轮缩放
========================= */

lightboxImage.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();


        if(event.deltaY < 0){

            scale += 0.15;

        }else{

            scale -= 0.15;

        }


        /*
           最小 0.05
           最大 5
        */

        if(scale < 0.05){

            scale = 0.05;

        }


        if(scale > 5){

            scale = 5;

        }


        updateTransform();

    },
    { passive:false }
);



/* =========================
   电脑鼠标拖动
========================= */

lightboxImage.addEventListener(
    "mousedown",
    function(event){

        event.preventDefault();

        isDragging = true;

        startX =
            event.clientX;

        startY =
            event.clientY;

        lastX =
            translateX;

        lastY =
            translateY;

    }
);


document.addEventListener(
    "mousemove",
    function(event){

        if(!isDragging){

            return;

        }


        translateX =
            lastX +
            (
                event.clientX -
                startX
            );


        translateY =
            lastY +
            (
                event.clientY -
                startY
            );


        updateTransform();

    }
);


document.addEventListener(
    "mouseup",
    function(){

        isDragging = false;

    }
);



/* =========================
   手机触摸缩放
========================= */

let initialDistance = 0;

let initialScale = 1;


/*
   计算两指距离
*/

function getTouchDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/*
   双指缩放 / 单指拖动开始
*/

lightboxImage.addEventListener(
    "touchstart",
    function(event){

        if(event.touches.length === 2){

            event.preventDefault();

            initialDistance =
                getTouchDistance(
                    event.touches
                );

            initialScale =
                scale;

        }

        else if(event.touches.length === 1){

            startX =
                event.touches[0].clientX;

            startY =
                event.touches[0].clientY;

            lastX =
                translateX;

            lastY =
                translateY;

        }

    },
    { passive:false }
);


/*
   双指缩放 / 单指拖动
*/

lightboxImage.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();


        /*
           双指缩放
        */

        if(event.touches.length === 2){

            const currentDistance =
                getTouchDistance(
                    event.touches
                );


            if(initialDistance > 0){

                scale =
                    initialScale *
                    (
                        currentDistance /
                        initialDistance
                    );


                if(scale < 0.05){

                    scale = 0.05;

                }


                if(scale > 5){

                    scale = 5;

                }


                updateTransform();

            }

        }


        /*
           单指拖动
        */

        else if(event.touches.length === 1){

            translateX =
                lastX +
                (
                    event.touches[0].clientX -
                    startX
                );


            translateY =
                lastY +
                (
                    event.touches[0].clientY -
                    startY
                );


            updateTransform();

        }

    },
    { passive:false }
);


lightboxImage.addEventListener(
    "touchend",
    function(){

        initialDistance = 0;

    }
);


</script>
<script src="music.js"></script>

</body>

</html>
