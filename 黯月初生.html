<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>
黯月初生
</title>

<link rel="stylesheet" href="detail.css">

</head>


<body>


<!-- =========================
     顶部标题
     ========================= -->

<header class="detail-header">

<a
    href="index.html"
    class="back-home">
    ← 返回剧本查阅
</a>


<h1>
黯月初生
</h1>


<div class="author">
作者：官方
</div>

</header>



<!-- =========================
     剧本简介
     ========================= -->

<section class="intro">


<button
    id="musicToggle"
    class="music-toggle">
    🎵 音乐：开
</button>



<p>

冬日的暮色渐近，太阳被盘陀的天际线所吞噬。

橙红的枫叶被黑色斑点逐渐侵蚀，森林无声地期待着雪花将至。

小镇边缘的岩隙深处传来阵阵饿狼的嚎叫。

旅行者们匆匆步入旅店，却浑然不觉一双双怪异而邪恶的眼睛正在靠近。

众生皆知，今夜将有……

黯月初生。

</p>


<!-- =========================
     背景音乐
     ========================= -->

<audio
    id="bgMusic"
    loop
    preload="metadata">

    <source
        src="BrunuhVille - The Wolf and the Moon.mp3"
        type="audio/mpeg">

</audio>


</section>



<!-- =========================
     剧本图片
     ========================= -->

<section class="gallery">


<div>

<img
    src="new-03.webp"
    alt="黯月初生图片1">

</div>


<div>

<img
    src="new-04.webp"
    alt="黯月初生图片2">

</div>


</section>



<!-- =========================
     图片放大层
     ========================= -->

<div
    id="imageLightbox"
    class="image-lightbox">


<button
    id="imageLightboxClose"
    class="image-lightbox-close">

    ×

</button>


<img
    id="lightboxImage"
    src=""
    alt="剧本图片">


</div>



<!-- =========================
     音乐
     ========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


    const music =
        document.getElementById("bgMusic");


    const button =
        document.getElementById("musicToggle");


    /* =========================
       音量 10%
       ========================= */

    music.volume = 0.1;


    /* =========================
       记住“黯月初生”
       自己的音乐状态
       ========================= */

    const savedState =
        localStorage.getItem("music-anyue");


    if (savedState === "off") {


        music.pause();


        button.textContent =
            "🎵 音乐：关";


    } else {


        music.play().catch(function () {


            /*
            浏览器禁止自动播放时，
            第一次点击页面后尝试播放
            */

            document.addEventListener(
                "click",
                function startMusic() {


                    music.play().catch(
                        function(){}
                    );


                    document.removeEventListener(
                        "click",
                        startMusic
                    );


                },
                {
                    once:true
                }
            );


        });


    }



    /* =========================
       音乐开关
       ========================= */

    button.addEventListener(
        "click",
        function (event) {


        event.stopPropagation();


        if (music.paused) {


            music.play().catch(
                function(){}
            );


            localStorage.setItem(
                "music-anyue",
                "on"
            );


            button.textContent =
                "🎵 音乐：开";


        } else {


            music.pause();


            localStorage.setItem(
                "music-anyue",
                "off"
            );


            button.textContent =
                "🎵 音乐：关";


        }


    });


});

</script>



<!-- =========================
     图片放大 / 缩放 / 拖动
     ========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


    const lightbox =
        document.getElementById(
            "imageLightbox"
        );


    const lightboxImage =
        document.getElementById(
            "lightboxImage"
        );


    const closeButton =
        document.getElementById(
            "imageLightboxClose"
        );


    const galleryImages =
        document.querySelectorAll(
            ".gallery img"
        );



    /* =========================
       图片缩放参数
       ========================= */

    let scale = 1;


    let translateX = 0;

    let translateY = 0;



    /* =========================
       电脑鼠标拖动参数
       ========================= */

    let isDragging = false;


    let startX = 0;

    let startY = 0;


    let startTranslateX = 0;

    let startTranslateY = 0;



    /* =========================
       更新图片
       ========================= */

    function updateImage() {


        lightboxImage.style.transform =
            "translate(" +
            translateX +
            "px, " +
            translateY +
            "px) scale(" +
            scale +
            ")";


    }



    /* =========================
       重置图片
       ========================= */

    function resetImage() {


        scale = 1;


        translateX = 0;

        translateY = 0;


        updateImage();


    }



    /* =========================
       点击剧本图片
       ========================= */

    galleryImages.forEach(
        function (image) {


        image.addEventListener(
            "click",
            function (event) {


                event.preventDefault();


                lightboxImage.src =
                    image.currentSrc ||
                    image.src;


                lightboxImage.alt =
                    image.alt ||
                    "剧本图片";


                resetImage();


                lightbox.classList.add(
                    "show"
                );


                /* 禁止背景页面滚动 */

                document.body.style.overflow =
                    "hidden";


            }
        );


    });



    /* =========================
       关闭图片
       ========================= */

    function closeLightbox() {


        lightbox.classList.remove(
            "show"
        );


        document.body.style.overflow =
            "";


        resetImage();


    }



    /* =========================
       点击右上角 ×
       ========================= */

    closeButton.addEventListener(
        "click",
        function (event) {


            event.preventDefault();


            event.stopPropagation();


            closeLightbox();


        }
    );



    /* =========================
       点击黑色背景关闭
       ========================= */

    lightbox.addEventListener(
        "click",
        function (event) {


            if (
                event.target === lightbox
            ) {


                closeLightbox();


            }


        }
    );



    /* =========================
       电脑：鼠标滚轮缩放
       ========================= */

    lightbox.addEventListener(
        "wheel",
        function (event) {


            if (
                !lightbox.classList.contains(
                    "show"
                )
            ) {


                return;


            }


            event.preventDefault();



            if (event.deltaY < 0) {


                scale += 0.15;


            } else {


                scale -= 0.15;


            }



            /* =========================
               最小 0.05 倍
               ========================= */

            if (scale < 0.05) {


                scale = 0.05;


            }



            /* =========================
               最大 5 倍
               ========================= */

            if (scale > 5) {


                scale = 5;


            }


            updateImage();


        },
        {
            passive:false
        }
    );



    /* =========================
       电脑：鼠标左键按住拖动
       ========================= */

    lightboxImage.addEventListener(
        "mousedown",
        function (event) {


            if (event.button !== 0) {


                return;


            }


            event.preventDefault();


            isDragging = true;


            startX =
                event.clientX;


            startY =
                event.clientY;


            startTranslateX =
                translateX;


            startTranslateY =
                translateY;


        }
    );



    /* =========================
       鼠标移动
       ========================= */

    document.addEventListener(
        "mousemove",
        function (event) {


            if (!isDragging) {


                return;


            }


            translateX =
                startTranslateX +
                (
                    event.clientX -
                    startX
                );


            translateY =
                startTranslateY +
                (
                    event.clientY -
                    startY
                );


            updateImage();


        }
    );



    /* =========================
       松开鼠标
       ========================= */

    document.addEventListener(
        "mouseup",
        function () {


            isDragging = false;


        }
    );



    /* =========================
       手机：双指缩放
       ========================= */

    let initialDistance = 0;


    let initialScale = 1;



    function getDistance(
        touch1,
        touch2
    ) {


        const dx =
            touch1.clientX -
            touch2.clientX;


        const dy =
            touch1.clientY -
            touch2.clientY;


        return Math.sqrt(
            dx * dx +
            dy * dy
        );


    }



    lightboxImage.addEventListener(
        "touchstart",
        function (event) {


            if (
                event.touches.length === 2
            ) {


                initialDistance =
                    getDistance(
                        event.touches[0],
                        event.touches[1]
                    );


                initialScale =
                    scale;


            }


        },
        {
            passive:false
        }
    );



    lightboxImage.addEventListener(
        "touchmove",
        function (event) {


            if (
                event.touches.length === 2
            ) {


                event.preventDefault();


                const currentDistance =
                    getDistance(
                        event.touches[0],
                        event.touches[1]
                    );


                scale =
                    initialScale *
                    (
                        currentDistance /
                        initialDistance
                    );



                /* =========================
                   最小 0.05 倍
                   ========================= */

                if (scale < 0.05) {


                    scale = 0.05;


                }



                /* =========================
                   最大 5 倍
                   ========================= */

                if (scale > 5) {


                    scale = 5;


                }


                updateImage();


            }


        },
        {
            passive:false
        }
    );



    /* =========================
       手机：单指拖动
       ========================= */

    let touchStartX = 0;

    let touchStartY = 0;


    let touchStartTranslateX = 0;

    let touchStartTranslateY = 0;



    lightboxImage.addEventListener(
        "touchstart",
        function (event) {


            if (
                event.touches.length === 1
            ) {


                touchStartX =
                    event.touches[0].clientX;


                touchStartY =
                    event.touches[0].clientY;


                touchStartTranslateX =
                    translateX;


                touchStartTranslateY =
                    translateY;


            }


        },
        {
            passive:false
        }
    );



    lightboxImage.addEventListener(
        "touchmove",
        function (event) {


            if (
                event.touches.length === 1
            ) {


                event.preventDefault();


                translateX =
                    touchStartTranslateX +
                    (
                        event.touches[0].clientX -
                        touchStartX
                    );


                translateY =
                    touchStartTranslateY +
                    (
                        event.touches[0].clientY -
                        touchStartY
                    );


                updateImage();


            }


        },
        {
            passive:false
        }
    );



    /* =========================
       Esc 关闭
       ========================= */

    document.addEventListener(
        "keydown",
        function (event) {


            if (event.key === "Escape") {


                closeLightbox();


            }


        }
    );


});

</script>



</body>

</html>
