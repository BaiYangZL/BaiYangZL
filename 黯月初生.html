<body>


<header class="detail-header">

    href="index.html"

<h1>
黯月初生
</h1>


<div class="author">
作者：官方
</div>


</header>



<section class="intro">

<button id="musicToggle" class="music-toggle">
    🎵 音乐：开
</button>



<p>

冬日的暮色渐近，太阳被盘陀的天际线所吞噬。

橙红的枫叶被黑色斑点逐渐侵蚀，森林无声地期待着雪花将至。

小镇边缘的岩隙深处传来阵阵饿狼的嚎叫。

旅行者们匆匆步入旅店，却浑然不觉一双双怪异而邪恶的眼睛正在靠近。

众生皆知，今夜将有……

黯月初升。

</p>
<audio id="bgMusic" loop preload="metadata">
    <source src="暗流涌动.mp3" type="audio/mpeg">
</audio>

</section>




<section class="gallery">


<div>

<img src="new-03.webp">

</div>


<div>

<img src="new-04.webp">

</div>


</section>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const music = document.getElementById("bgMusic");
    const button = document.getElementById("musicToggle");

    // 音量 10%
    music.volume = 0.1;

    // 记住暗流涌动自己的音乐状态
    const savedState = localStorage.getItem("music-anyue");

    if (savedState === "off") {

        music.pause();

        button.textContent = "🎵 音乐：关";

    } else {

        music.play().catch(function () {

            // 浏览器禁止自动播放时，
            // 第一次点击页面后尝试播放
            document.addEventListener(
                "click",
                function startMusic() {

                    music.play().catch(function(){});

                    document.removeEventListener(
                        "click",
                        startMusic
                    );

                },
                { once:true }
            );

        });

    }


    // 点击音乐按钮
    button.addEventListener("click", function (event) {

        event.stopPropagation();

        if (music.paused) {

            music.play().catch(function(){});

            localStorage.setItem(
                "music-anliu",
                "on"
            );

            button.textContent = "🎵 音乐：开";

        } else {

            music.pause();

            localStorage.setItem(
                "music-anliu",
                "off"
            );

            button.textContent = "🎵 音乐：关";

        }

    });

});

</script>


</body>

</html>
