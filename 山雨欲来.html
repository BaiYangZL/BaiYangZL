<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>山雨欲来</title>

<link rel="stylesheet" href="detail.css">

</head>


<body>


<header class="detail-header">

<a
    href="index.html"
    class="back-home">
    ← 返回剧本查阅
</a>

<h1>
山雨欲来
</h1>

<div class="author">
作者：官方
</div>

</header>



<section class="intro">

<button id="musicToggle" class="music-toggle">
🎵 音乐：开
</button>


<p>

骤雨将临。

天地之间弥漫着沉重的阴霾。

这里曾是守护一方的雄关。

城墙上的旌旗依旧飘扬。

然而和平的表象之下，

危险正在靠近。

失踪的士兵。

诡异的传闻。

隐藏在黑暗中的力量。

所有人都不知道，

这座坚固的城池还能坚持多久。


山雨欲来。

</p>

</section>



<section class="gallery">


<div>

<img src="17.webp" alt="山雨欲来">

</div>


<div>

<img src="18.webp" alt="山雨欲来">

</div>


</section>



<!-- 背景音乐 -->

<audio
    id="bgMusic"
    src="陈悦 - 乱红.mp3"
    loop
    preload="auto">
</audio>



<!-- 图片放大查看 -->

<div
    id="imageLightbox"
    class="image-lightbox">

<button
    id="lightboxClose"
    class="lightbox-close"
    type="button">
    ×
</button>

<img
    id="lightboxImage"
    src=""
    alt="放大图片">

</div>



<script>

/* =========================
   背景音乐
========================= */

const bgMusic = document.getElementById("bgMusic");
const musicToggle = document.getElementById("musicToggle");

const musicKey = "music-shanyulai";

let musicEnabled =
    localStorage.getItem(musicKey) !== "off";

bgMusic.volume = 0.1;


function updateMusicButton(){

    if(musicEnabled){

        musicToggle.textContent = "🎵 音乐：开";

    }else{

        musicToggle.textContent = "🎵 音乐：关";

    }

}


async function startMusic(){

    if(!musicEnabled){

        return;

    }

    try{

        await bgMusic.play();

    }catch(error){

        /* 浏览器阻止自动播放时，
           等待用户第一次点击页面 */

    }

}


musicToggle.addEventListener("click", function(){

    if(bgMusic.paused){

        musicEnabled = true;

        localStorage.setItem(musicKey, "on");

        bgMusic.volume = 0.1;

        bgMusic.play().catch(function(){});

    }else{

        musicEnabled = false;

        localStorage.setItem(musicKey, "off");

        bgMusic.pause();

    }

    updateMusicButton();

});


/* 浏览器禁止自动播放时，
   用户第一次操作页面后尝试播放 */

document.addEventListener("click", function startAfterInteraction(){

    if(musicEnabled && bgMusic.paused){

        bgMusic.play().catch(function(){});

    }

    document.removeEventListener(
        "click",
        startAfterInteraction
    );

}, { once:true });


updateMusicButton();

startMusic();



/* =========================
   图片放大 / 缩放 / 拖动
========================= */

const lightbox =
    document.getElementById("imageLightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const galleryImages =
    document.querySelectorAll(".gallery img");


let scale = 1;

let translateX = 0;
let translateY = 0;


/* 鼠标拖动 */

let isDragging = false;

let startX = 0;
let startY = 0;

let startTranslateX = 0;
let startTranslateY = 0;


/* 手机双指 */

let initialPinchDistance = null;
let initialPinchScale = 1;


/* 更新图片位置 */

function updateImageTransform(){

    lightboxImage.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) " +
        "scale(" +
        scale +
        ")";

}


/* 重置 */

function resetImage(){

    scale = 1;

    translateX = 0;
    translateY = 0;

    updateImageTransform();

}


/* 打开图片 */

galleryImages.forEach(function(img){

    img.addEventListener("click", function(){

        lightboxImage.src = img.src;

        lightboxImage.alt =
            img.alt || "放大图片";

        resetImage();

        lightbox.classList.add("show");

        document.body.style.overflow = "hidden";

    });

});


/* 关闭 */

function closeLightbox(){

    lightbox.classList.remove("show");

    document.body.style.overflow = "";

    lightboxImage.src = "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


/* 点击黑色区域关闭 */

lightbox.addEventListener("click", function(e){

    if(e.target === lightbox){

        closeLightbox();

    }

});


/* =========================
   键盘 Esc
========================= */

document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        closeLightbox();

    }

});



/* =========================
   鼠标滚轮缩放
========================= */

lightboxImage.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        if(e.deltaY < 0){

            scale += 0.15;

        }else{

            scale -= 0.15;

        }


        scale = Math.max(
            0.05,
            Math.min(5, scale)
        );


        updateImageTransform();

    },
    { passive:false }
);



/* =========================
   鼠标拖动
========================= */

lightboxImage.addEventListener(
    "mousedown",
    function(e){

        e.preventDefault();

        isDragging = true;

        startX = e.clientX;
        startY = e.clientY;

        startTranslateX = translateX;
        startTranslateY = translateY;

    }
);


document.addEventListener(
    "mousemove",
    function(e){

        if(!isDragging){

            return;

        }


        translateX =
            startTranslateX +
            (e.clientX - startX);

        translateY =
            startTranslateY +
            (e.clientY - startY);


        updateImageTransform();

    }
);


document.addEventListener(
    "mouseup",
    function(){

        isDragging = false;

    }
);



/* =========================
   手机触摸
========================= */

lightboxImage.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();


        /* 双指 */

        if(e.touches.length === 2){

            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;

            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;


            initialPinchDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            initialPinchScale = scale;

            return;

        }


        /* 单指 */

        if(e.touches.length === 1){

            startX =
                e.touches[0].clientX;

            startY =
                e.touches[0].clientY;

            startTranslateX = translateX;
            startTranslateY = translateY;

        }

    },
    { passive:false }
);



lightboxImage.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();


        /* 双指缩放 */

        if(
            e.touches.length === 2 &&
            initialPinchDistance
        ){

            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;

            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;


            const currentDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            scale =
                initialPinchScale *
                (
                    currentDistance /
                    initialPinchDistance
                );


            scale = Math.max(
                0.05,
                Math.min(5, scale)
            );


            updateImageTransform();

            return;

        }


        /* 单指拖动 */

        if(e.touches.length === 1){

            translateX =
                startTranslateX +
                (
                    e.touches[0].clientX -
                    startX
                );

            translateY =
                startTranslateY +
                (
                    e.touches[0].clientY -
                    startY
                );


            updateImageTransform();

        }

    },
    { passive:false }
);



lightboxImage.addEventListener(
    "touchend",
    function(e){

        if(e.touches.length < 2){

            initialPinchDistance = null;

        }

    }
);

</script>


</body>

</html>
