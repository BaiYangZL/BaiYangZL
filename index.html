<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>夜半狂欢</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #07151c;
            color: #f5f0e6;
            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;
        }

        /* =========================
           顶部
        ========================= */

        .header {
            text-align: center;
            padding: 55px 20px 45px;

            background:
                radial-gradient(
                    circle at center,
                    #173844 0%,
                    #0b2029 45%,
                    #07151c 100%
                );

            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .header h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: 8px;
            color: #e8c978;
            text-shadow:
                0 0 12px rgba(232,201,120,0.35);
        }

        .header p {
            margin: 18px 0 0;
            color: #b9c6c9;
            font-size: 16px;
        }

        /* =========================
           图片区域
        ========================= */

        .gallery {
            max-width: 1500px;
            margin: 0 auto;
            padding: 45px 30px 60px;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 35px;
        }

        .card {
            background: #101f27;
            border: 1px solid rgba(232,201,120,0.25);
            border-radius: 14px;
            overflow: hidden;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.45);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 20px 55px rgba(0,0,0,0.6);
        }

        .card a {
            display: block;
            text-decoration: none;
        }

        .card img {
            display: block;

            width: 100%;
            height: auto;

            /* 保持图片原比例 */
            object-fit: contain;

            background: #050b0f;
        }

        .card-title {
            padding: 16px 20px;

            text-align: center;

            color: #e8c978;
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* =========================
           底部
        ========================= */

        .footer {
            text-align: center;

            padding: 45px 20px 60px;

            border-top:
                1px solid rgba(255,255,255,0.1);

            color: #89999e;

            font-size: 14px;
        }

        /* =========================
           手机适配
        ========================= */

        @media (max-width: 800px) {

            .header {
                padding: 40px 15px 35px;
            }

            .header h1 {
                font-size: 34px;
                letter-spacing: 5px;
            }

            .gallery {
                grid-template-columns: 1fr;
                padding: 25px 15px 45px;
                gap: 25px;
            }

            .card-title {
                font-size: 16px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         网站顶部
    ========================== -->

    <header class="header">

        <h1>夜半狂欢</h1>

        <p>
            “旋转木马”快速上手剧本
        </p>

    </header>


    <!-- =========================
         两张高清图片
    ========================== -->

    <main class="gallery">

        <!-- 第一张 -->

        <div class="card">

            <a
                href="night-01.jpg"
                target="_blank"
                rel="noopener"
            >

                <img
                    src="night-01.jpg"
                    alt="夜半狂欢 第一张"
                >

            </a>

            <div class="card-title">
                夜半狂欢 · 剧本介绍
            </div>

        </div>


        <!-- 第二张 -->

        <div class="card">

            <a
                href="night-02.jpg"
                target="_blank"
                rel="noopener"
            >

                <img
                    src="night-02.jpg"
                    alt="夜半狂欢 第二张"
                >

            </a>

            <div class="card-title">
                夜半狂欢 · 角色与规则
            </div>

        </div>

    </main>


    <!-- =========================
         网站底部
    ========================== -->

    <footer class="footer">

        <div>
            白羊的血染钟楼
        </div>

        <div style="margin-top: 10px;">
            剧本作者：Zets
        </div>

    </footer>

</body>
</html>
