<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:

linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.85)
),

url("library.jpg");


background-size:cover;

background-attachment:fixed;


color:#f5e8c8;

font-family:

"Microsoft YaHei",
serif;


}


/* 顶部 */


.header{


text-align:center;

padding:90px 20px 60px;


background:

rgba(0,0,0,.45);


}



.header h1{


margin:0;


font-size:56px;


letter-spacing:15px;


color:#e8c978;


text-shadow:


0 0 25px #8b6b2e;


}


.header p{


font-size:22px;

letter-spacing:8px;

color:#d6c49b;


}



/* 书架 */


.bookshelf{


max-width:1500px;


margin:auto;


padding:60px 50px;


display:grid;


grid-template-columns:

repeat(5,1fr);


gap:45px;


}



/* 每一本书 */


.book{


background:


linear-gradient(
145deg,
#3b2818,
#17100b
);


padding:15px;


border:


1px solid rgba(232,201,120,.5);


box-shadow:


0 20px 40px black;


transition:.3s;



}



.book:hover{


transform:

translateY(-12px);


}





.book img{


width:100%;


height:420px;


object-fit:cover;


display:block;


}




.book h2{


text-align:center;


font-size:22px;


letter-spacing:4px;


font-weight:normal;


color:#e8c978;


margin:20px 0 10px;


}



.book a{


text-decoration:none;


}





.footer{


text-align:center;


padding:60px;


color:#aaa;


}



/* 电脑 */


@media(max-width:1200px){


.bookshelf{


grid-template-columns:

repeat(4,1fr);


}

}


/* 平板 */


@media(max-width:800px){


.header h1{


font-size:34px;


letter-spacing:8px;


}



.bookshelf{


grid-template-columns:

repeat(2,1fr);


padding:30px 20px;


gap:25px;


}



.book img{


height:300px;


}


.book h2{


font-size:18px;


}



}




</style>


</head>
