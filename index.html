<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>白羊的血染钟楼</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1015;
    color: #f5f0e6;
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;
}

/* 顶部 */
.header {
    padding: 45px 20px 35px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    background:
        radial-gradient(circle at center, #202c35 0%, #0b1015 65%);
}

.header h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 6px;
    font-weight: 700;
}

.header p {
    margin: 14px 0 0;
    color: #aaa;
    font-size: 16px;
}

/* 内容区域 */
.container {
    width: min(1400px, 94%);
    margin: 0 auto;
    padding: 50px 0 80px;
}

/* 系列标题 */
.series-title {
    text-align: center;
    margin-bottom: 40px;
}

.series-title h2 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 4px;
}

.series-title p {
    margin-top: 12px;
    color: #aaa;
    font-size: 15px;
}

/* 图片区域 */
.gallery {
    display: flex;
    flex-direction: column;
    gap: 50px;
    align-items: center;
}

/* 图片卡片 */
.card {
    width: 100%;
    max-width: 1100px;
    background: #111820;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

.card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    cursor: zoom-in;
}

/* 图片下面的名字 */
.card-title {
    text-align: center;
    padding: 18px 10px 8px;
    font-size: 18px;
    color: #ddd;
}

/* 底部 */
.footer {
    text-align: center;
    padding: 30px 20px 45px;
    color: #777;
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.08);
}

/* 放大图片 */
.lightbox {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,0.92);
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

.close {
    position: fixed;
    top: 20px;
    right: 30px;
    font-size: 42px;
    color: white;
    cursor: pointer;
    z-index: 10000;
}

/* 手机 */
@media (max-width: 600px) {

    .header {
        padding: 30px 15px 25px;
    }

    .header h1 {
        font-size: 28px;
        letter-spacing: 3px;
    }

    .container {
        width: 94%;
        padding-top: 35px;
    }

    .series-title h2 {
        font-size: 25px;
    }

    .card {
        padding: 8px;
        border-radius: 10px;
    }

    .card-title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- 网站标题 -->
<header class="header">
    <h1>白羊的血染钟楼</h1>
    <p>Blood on the Clocktower · 剧本资料库</p>
</header>

<main class="container">

    <!-- 系列标题 -->
    <section class="series-title">
        <h2>夜半狂欢</h2>
        <p>旋转木马“快速上手剧本” · 剧本作者：Zets</p>
    </section>

    <!-- 两张系列图片 -->
    <section class="gallery">

        <div class="card">
            <img
                src="night-01.jpg"
                alt="夜半狂欢"
                onclick="openImage(this.src)"
            >
            <div class="card-title">
                夜半狂欢 · 剧本介绍
            </div>
        </div>

        <div class="card">
            <img
                src="night-02.jpg"
                alt="夜半狂欢角色表"
                onclick="openImage(this.src)"
            >
            <div class="card-title">
                夜半狂欢 · 角色与规则
            </div>
        </div>

    </section>

</main>

<footer class="footer">
    白羊的血染钟楼
</footer>

<!-- 图片放大 -->
<div class="lightbox" id="lightbox" onclick="closeImage()">
    <span class="close">×</span>
    <img id="bigImage" src="" alt="">
</div>

<script>
function openImage(src) {
    document.getElementById("bigImage").src = src;
    document.getElementById("lightbox").style.display = "flex";
}

function closeImage() {
    document.getElementById("lightbox").style.display = "none";
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeImage();
    }
});
</script>

</body>
</html>
