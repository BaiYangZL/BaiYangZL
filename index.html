<style>


*{
box-sizing:border-box;
}



body{

margin:0;

background:

linear-gradient(
rgba(0,0,0,0.65),
rgba(0,0,0,0.85)
),

url("library.jpg");


background-size:cover;

background-position:center;

background-attachment:fixed;


color:#f5e8c8;


font-family:

"Microsoft YaHei",
"STKaiti",
serif;

}



/* 顶部 */


.header{


text-align:center;


padding:

90px 20px 70px;


background:

rgba(0,0,0,.45);


border-bottom:

1px solid rgba(232,201,120,.3);


}



.header h1{


margin:0;


font-size:60px;


letter-spacing:15px;


color:#e8c978;


text-shadow:

0 0 25px rgba(232,201,120,.6);


}



.header .sub{


margin-top:25px;


font-size:24px;


letter-spacing:10px;


color:#d7c49a;


}




.header .line{


width:260px;


height:1px;


background:#d7b86a;


margin:35px auto;


}





/* 书架区域 */


.bookshelf{


max-width:1600px;


margin:auto;


padding:

70px 50px;


display:grid;


grid-template-columns:

repeat(5,1fr);


gap:45px;


}




/* 单本书 */


.book{


background:


linear-gradient(
145deg,
#392719,
#120d09
);


padding:15px;


border:

1px solid rgba(232,201,120,.45);


box-shadow:

0 20px 45px rgba(0,0,0,.8);


transition:.35s;


}



.book:hover{


transform:

translateY(-12px);


box-shadow:

0 30px 60px rgba(0,0,0,.9);


}




.book a{


text-decoration:none;


}





.book img{


width:100%;


height:420px;


object-fit:cover;


display:block;


}





.book h2{


text-align:center;


font-size:22px;


font-weight:normal;


letter-spacing:5px;


color:#e8c978;


margin:

22px 0 10px;


}





/* 底部 */


.footer{


text-align:center;


padding:

70px 20px;


color:#aaa;


line-height:2;


border-top:

1px solid rgba(255,255,255,.1);


}





/* 平板 */


@media(max-width:1200px){


.bookshelf{


grid-template-columns:

repeat(4,1fr);


}


}




/* 手机 */


@media(max-width:800px){



.header{


padding:

55px 15px;


}


.header h1{


font-size:34px;


letter-spacing:8px;


}


.header .sub{


font-size:18px;


letter-spacing:5px;


}




.bookshelf{


grid-template-columns:

repeat(2,1fr);


padding:

30px 15px;


gap:25px;


}




.book img{


height:280px;


}




.book h2{


font-size:17px;


letter-spacing:3px;


}



}




</style>


</head>
