<style>


*{
    box-sizing:border-box;
}



html{
    scroll-behavior:smooth;
}



body{

    margin:0;


    min-height:100vh;


    color:#ead9ae;


    font-family:
    "Microsoft YaHei",
    "Songti SC",
    serif;



    background:


    linear-gradient(
        rgba(18,10,5,.78),
        rgba(8,5,3,.92)
    ),


    radial-gradient(
        circle at top,
        #684b2b,
        #120904 75%
    );


}



/* ===================
   钟楼标题
=================== */


.header{


    text-align:center;


    padding:

    90px 20px 60px;


}



.candle{


    font-size:42px;


}



.header h1{


    margin:

    25px 0 15px;


    font-size:

    58px;


    letter-spacing:

    14px;



    color:#e3bf70;


    font-family:

    "Songti SC",
    serif;



    text-shadow:


    0 0 25px

    rgba(227,191,112,.5);


}




.subtitle{


    font-size:20px;


    letter-spacing:7px;


    color:#b69a62;


}




.divider{


    width:360px;


    height:1px;


    margin:40px auto;


    background:#c29a52;


}



.desc{


    letter-spacing:5px;


    font-size:18px;


    color:#9a8052;


}




/* ===================
   藏书区域
=================== */


.library{


    width:100%;


    max-width:1700px;


    margin:auto;


    padding:

    20px 50px 100px;


}




.books{


    display:grid;


    grid-template-columns:

    repeat(5,1fr);



    gap:

    65px 45px;



}



/* ===================
   单本剧本
=================== */


.book{


    text-align:center;


    transition:.35s;


}



.book a{


    text-decoration:none;


    color:inherit;


}



.cover{


    width:100%;


    aspect-ratio:

    2 / 3;



    object-fit:cover;



    border-radius:6px;



    border:

    8px solid #352116;



    box-shadow:


    0 25px 45px

    rgba(0,0,0,.85);



    transition:.35s;



}




.book:hover{


    transform:

    translateY(-12px);


}




.book:hover .cover{


    box-shadow:


    0 35px 60px

    rgba(0,0,0,.95);



}




.book-name{


    margin-top:22px;



    font-size:21px;



    letter-spacing:5px;



    color:#e8c978;



}




.archive{


    margin-top:10px;


    font-size:12px;



    letter-spacing:4px;



    color:#806946;


}



/* ===================
   底部
=================== */


.footer{


    text-align:center;


    padding:

    50px 20px 80px;



    border-top:


    1px solid

    rgba(255,255,255,.1);



    color:#887252;



}



/* ===================
   平板
=================== */


@media(max-width:1200px){


.books{


grid-template-columns:

repeat(4,1fr);


}



}



/* ===================
   手机
=================== */


@media(max-width:800px){


.header h1{


font-size:32px;


letter-spacing:6px;


}



.library{


padding:

20px;


}



.books{


grid-template-columns:

repeat(2,1fr);


gap:

35px 20px;


}



.book-name{


font-size:16px;


letter-spacing:3px;


}


}



</style>


</head>
